<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Покер Офис</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="graphite" data-cards="four">
<div id="stage">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="au" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2a0"/><stop offset=".45" stop-color="#ffcf1a"/><stop offset="1" stop-color="#b87800"/></linearGradient>
  <!-- золотая фишка победителя турнира: наклейка у аватарки -->
  <symbol id="winchip" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13.6" fill="url(#au)" stroke="#8a5a00" stroke-width="1.2"/><path d="M16 3.5v4M16 24.5v4M3.5 16h4M24.5 16h4M7.2 7.2l2.8 2.8M22 22l2.8 2.8M24.8 7.2L22 10M10 22l-2.8 2.8" stroke="#fff" stroke-width="3.2" opacity=".9"/><circle cx="16" cy="16" r="7.5" fill="#1c1c1e"/><path d="M16 11.5l1.5 3 3.3.4-2.4 2.3.6 3.3-3-1.6-3 1.6.6-3.3-2.4-2.3 3.3-.4z" fill="#ffd60a"/></symbol>
</defs></svg>
<section id="login" hidden>
  <form id="loginForm" class="sheet">
    <div class="appicon">♠</div>
    <h1 class="wordmark"><span>Покер</span><small><i>Офис</i></small></h1>
    <div class="sub">Игра по локальной сети</div>
    <label class="caption" for="nick">Ваш ник</label>
    <input id="nick" maxlength="14" autocomplete="off" placeholder="От 2 до 14 символов">
    <div class="caption">Аватарка</div>
    <div id="avatars" class="avatars"></div>
    <div id="loginError" class="error"></div>
    <button class="primary large" type="submit">Сесть за стол</button>
  </form>
</section>

<section id="game" hidden>
  <header>
    <div class="lead">
      <nav>
        <button id="btnPlayers" class="icon" title="Стол: игроки и итоги"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.2 2.7-5.4 6-5.4s6 2.2 6 5.4"/><circle cx="17.2" cy="9" r="2.4"/><path d="M17.4 13.6c2.2.1 3.6 1.7 3.6 4.4"/></svg></button>
        <button id="btnCombos" class="icon" title="Комбинации по старшинству"><svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="6" width="10" height="14" rx="2" transform="rotate(-8 8.5 13)"/><rect x="10.5" y="4" width="10" height="14" rx="2" transform="rotate(8 15.5 11)"/></svg></button>
      </nav>
      <div id="info"></div>
    </div>
    <div class="trail">
      <nav>
        <button id="btnReact" class="icon" title="Реакции" hidden><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.3c1 1.3 2.2 1.9 3.5 1.9s2.5-.6 3.5-1.9"/><path d="M9 9.4v.8M15 9.4v.8"/></svg></button>
        <button id="btnChat" class="icon" title="Чат"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-5.5L7 20v-4a3 3 0 0 1-3-3z"/></svg><span id="unread" hidden></span></button>
        <button id="btnPause" class="icon" title="Попросить паузу"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" stroke-width="2.2"/></svg></button>
        <button id="btnTable" class="icon" title="Игра: правила и оформление (админ)" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5c-2.5 3.5-7 6.3-7 10a3.8 3.8 0 0 0 6.2 2.9L10 20h4l-1.2-3.6A3.8 3.8 0 0 0 19 13.5c0-3.7-4.5-6.5-7-10z"/></svg></button>
        <button id="btnTour" class="icon" title="Турнир (админ)" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5.5a2.5 2.5 0 0 0 2.6 3.6M16 6h2.5a2.5 2.5 0 0 1-2.6 3.6"/><path d="M12 13v3.5M8.5 20h7M10 16.5h4l.5 3.5h-5z"/></svg></button>
        <button id="btnSeat" class="icon" title="Место за столом и выход"><svg class="ic" viewBox="0 0 24 24"><path d="M10 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20H10"/><path d="M15 16l4-4-4-4M19 12H9"/></svg></button>
      </nav>
    </div>
  </header>
  <div id="saveWarning" role="status" hidden></div>

  <main>
    <div id="table">
      <div id="felt"></div>
      <div id="center">
        <div id="pot"></div>
        <div id="board"></div>
        <div id="status"></div>
      </div>
      <div id="seats"></div>
      <div id="fx"></div>
    </div>
  </main>

  <footer id="actions"></footer>

  <div id="reactPop" class="rx-arc" hidden></div>
  <div id="seatMenu" class="menu" hidden></div>
  <div id="playerMenu" class="menu" hidden></div>
  <div id="askBar" class="ask" hidden></div>

  <aside id="sidePanel" class="panel" hidden>
    <div class="head">
      <div class="seg"><button data-tab="players">Игроки</button><button data-tab="combos">Комбинации</button></div>
      <button id="sideClose" class="icon" title="Закрыть"><svg class="ic" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
    </div>
    <div id="sideBody" class="body"></div>
  </aside>

  <aside id="chatPanel" class="panel" hidden>
    <div class="head"><div class="seg"><button data-ctab="chat">Чат</button><button data-ctab="log">Ход игры</button><button data-ctab="me">Профиль</button></div><button id="chatClose" class="icon" title="Закрыть"><svg class="ic" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
    <div id="logFilter" hidden></div>
    <div id="chatLog" class="log"></div>
    <div id="gameLog" class="log" hidden></div>
    <div id="profile" class="body" hidden></div>
    <form id="chatForm"><input id="chatInput" maxlength="200" autocomplete="off" placeholder="Сообщение"><button class="primary round" type="submit" title="Отправить"><svg class="ic" viewBox="0 0 24 24"><path d="M12 19V6M6.5 11.5L12 6l5.5 5.5" stroke-width="2"/></svg></button></form>
  </aside>

  <div id="settings" class="modal" hidden><div class="sheet" id="settingsBody"></div></div>
  <div id="pauseOverlay" class="modal" hidden><div class="sheet center pause"><div class="pause-ic"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" stroke-width="2.6"/></svg></div><h2>Игра на паузе</h2><p id="pauseText"></p><button id="btnResume" class="primary large">Продолжить игру</button></div></div>
  <div id="tourOverlay" class="modal" hidden><canvas id="confetti" aria-hidden="true"></canvas><div class="sheet center tour" id="tourBody"></div></div>
  <div id="toast" hidden></div>
</section>
</div>

<script src="app.js"></script>
</body>
</html>
